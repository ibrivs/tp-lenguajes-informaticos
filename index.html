<body>
    <header>
        <nav class="nav-principal" aria-label="principal">
            <img src="./imagenes/logo.png" alt="halloweentown" id="logo">
        </nav>
        <h1>Bienvenid@ a HalloweenTown</h1>
    </header>
    <main>
        <section>
            <h2>¿Estas buscando adentrarte a la oscuridad junto a nosotros?</h2>
            <p>Para presentarte en nuestras tierras primero debes darnos una pequeña visión de quién o más bien <i>qué</i> eres... joven visitante.</p>
            <hr>
            <form action="inicio.html" method="get">
                <label for="ciudadano">¿Qué eres?</label>
                <div class="selector">
                    <select name="ciudadano" id="ciudadano" required>
                        <option value="humano" class="humano">Humano</option>
                        <option value="fantasma" class="fantasma">Fantasma</option>
                        <option value="vampiro" class="vampiro">Vampiro</option>
                        <option value="bruja" class="bruja">Bruja</option>
                        <option value="zombie" class="zombie">Zombie</option>
                        <option value="monstruo" class="monstruo">Monstruo</option>
                        <option value="otro">Otro</option>
                    </select>
                    <button type="submit">Entrar</button>
                </div>
            </form>
            <hr>
        </section>
    </main>
    <footer>
        <address>
            <small>&copy; 1983 - 2026 Municipalidad de HalloweenTown. <br> Todos los derechos reservados.</small>
        </address>
    </footer>
</body>
