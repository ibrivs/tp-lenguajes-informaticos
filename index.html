<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalloweenTown</title> 
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Griffy&display=swap" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coral+Pixels&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <nav class="nav-principal" aria-label="principal">
        <img src="./imagenes/logo.png" alt="halloweentown" id="logo">
    </nav>
    <header>
        <h1>Bienvenid@ a HalloweenTown</h1>
    </header>
    <main>
        <form action="inicio.html" method="get">
            <label for="ciudadano">¿Que eres?</label>
            <select name="ciudadano" id="ciudadano" required>
                <option value="">Selecciona una opción</option>
                <option value="fantasma">Fantasma</option>
                <option value="vampiro">Vampiro</option>
                <option value="bruja">Bruja</option>
                <option value="zombie">Zombie</option>
                <option value="monstruo">Monstruo</option>
                <option value="otro">Otro</option>
            </select>
            <button type="submit">Entrar</button>
        </form>
    </main>
    <footer>
        <address>
            <small>&copy; 1983 - 2026 Municipalidad de HalloweenTown. <br> Todos los derechos reservados.</small>
        </address>
    </footer>
</body>
</html>
